[package]
name = "cascade_structscore"
version = "0.1.0"
edition = "2021"
description = "Structure file parsing and distance calculation for CASCADE evolution loop"

[[bin]]
name = "cascade_structscore"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pdbtbx = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
